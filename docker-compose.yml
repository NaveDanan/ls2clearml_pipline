services:
  postgres:
    image: postgres:15-alpine
    container_name: labelstudio-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labelstudio}
      POSTGRES_USER: ${POSTGRES_USER:-labelstudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labelstudio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labelstudio}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ls_network

  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: label-studio
    environment:
      DJANGO_DB: default
      POSTGRE_NAME: ${POSTGRES_DB:-labelstudio}
      POSTGRE_USER: ${POSTGRES_USER:-labelstudio}
      POSTGRE_PASSWORD: ${POSTGRES_PASSWORD:-labelstudio}
      POSTGRE_PORT: 5432
      POSTGRE_HOST: postgres
      LABEL_STUDIO_HOST: ${LABEL_STUDIO_HOST:-http://localhost:8090}
      # Configure Label Studio to use the shared volume
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: true
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /shared-data
    ports:
      - "8090:8080"  # Changed from 8080 to 8090 to avoid conflict with ClearML
    volumes:
      - label_studio_data:/label-studio/data
      # Shared volume for uploaded files - accessible from host and ClearML
      - ./shared-data:/shared-data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ls_network

volumes:
  postgres_data:
  label_studio_data:

networks:
  ls_network:
    driver: bridge
